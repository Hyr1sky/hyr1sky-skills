<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --ink: #17202a;
      --muted: #647181;
      --line: #d8dee6;
      --blue: #2764c9;
      --blue-soft: #e8f0ff;
      --green-soft: #e7f7ef;
      --amber-soft: #fff4d8;
      --violet-soft: #f0ecff;
      --red-soft: #ffecec;
      --code: #101827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.62;
      letter-spacing: 0;
    }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }
    header { padding: 28px 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    h1 { margin: 0 0 10px; font-size: 34px; line-height: 1.18; letter-spacing: 0; }
    h2 { margin: 34px 0 14px; font-size: 22px; line-height: 1.28; letter-spacing: 0; }
    h3 { margin: 20px 0 10px; font-size: 17px; letter-spacing: 0; }
    p { margin: 0 0 12px; }
    .lead { max-width: 900px; color: var(--muted); font-size: 17px; }
    .grid { display: grid; gap: 16px; }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
    .metric .value { display: block; font-size: 30px; line-height: 1.2; font-weight: 760; color: var(--blue); margin-bottom: 6px; }
    .metric .label { display: block; color: var(--ink); font-weight: 650; margin-bottom: 4px; }
    .metric .note { color: var(--muted); font-size: 14px; }
    .flow { display: grid; gap: 12px; margin-top: 12px; }
    .flow-row { display: grid; grid-template-columns: minmax(190px, 1fr) 34px minmax(190px, 1fr) 34px minmax(190px, 1fr); align-items: stretch; gap: 8px; }
    .flow-row.two { grid-template-columns: minmax(220px, 1fr) 34px minmax(220px, 1fr); }
    .node { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 14px; min-height: 104px; }
    .node strong { display: block; margin-bottom: 5px; font-size: 15px; }
    .node span { display: block; color: var(--muted); font-size: 14px; }
    .blue { background: var(--blue-soft); }
    .green { background: var(--green-soft); }
    .amber { background: var(--amber-soft); }
    .violet { background: var(--violet-soft); }
    .red { background: var(--red-soft); }
    .arrow { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #eef2f7; font-weight: 720; }
    tr:last-child td { border-bottom: 0; }
    pre { margin: 12px 0 0; padding: 14px; overflow: auto; color: #e6edf3; background: var(--code); border-radius: 8px; font-size: 13px; line-height: 1.48; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .94em; }
    @media (max-width: 920px) {
      .cols-3, .cols-2, .flow-row, .flow-row.two { grid-template-columns: 1fr; }
      .arrow { min-height: 24px; transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>{{TITLE}}</h1>
      <p class="lead">{{SUMMARY}}</p>
    </header>

    <section>
      <h2>Key Metrics</h2>
      <div class="grid cols-3">
        {{METRIC_CARDS}}
      </div>
    </section>

    <section>
      <h2>Pipeline</h2>
      {{PIPELINE}}
    </section>

    <section>
      <h2>Task / Method / Dataset / Metric / Result</h2>
      {{TMDR_TABLE}}
    </section>

    <section>
      <h2>Core Method</h2>
      {{CORE_METHOD}}
    </section>

    <section>
      <h2>External Context</h2>
      {{EXTERNAL_CONTEXT}}
    </section>

    <section>
      <h2>Gaps And Risks</h2>
      {{GAPS}}
    </section>
  </div>
</body>
</html>
